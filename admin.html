<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kalitheen Fish Shop</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="admin-logo">
                <i class="fas fa-fish"></i>
                <h2>Admin Panel</h2>
            </div>
            <nav class="admin-nav">
                <a href="#" class="admin-nav-link active">
                    <i class="fas fa-fish"></i>
                    <span>Fish Management</span>
                </a>
                <a href="index.html" class="admin-nav-link">
                    <i class="fas fa-home"></i>
                    <span>View Website</span>
                </a>
            </nav>
        </div>

        <div class="admin-main">
            <div class="admin-header">
                <h1>Update Daily Fish List</h1>
                <p>Manage today's fish inventory and prices</p>
            </div>

            <div class="admin-actions">
                <button class="btn btn-primary" onclick="exportFishList()">
                    <i class="fas fa-download"></i>
                    Export Data
                </button>
                <button class="btn btn-success" onclick="saveAllFish()">
                    <i class="fas fa-save"></i>
                    Save All Changes
                </button>
            </div>

            <div class="fish-management-grid" id="fishManagement">
                <!-- Fish management cards will be loaded here -->
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
